name: Q50 Factory InTouch Build
on:
  push:
    branches:
      - build/q50-factory-intouch-20261013
    paths:
      - q50-src-parts/**
      - .github/workflows/q50-factory-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble staged factory source
        run: |
          test "$(find q50-src-parts -type f -name '*.b64' | wc -l)" -eq 7
          cat q50-src-parts/*.b64 > /tmp/q50-source.b64
          test "$(wc -c < /tmp/q50-source.b64)" -eq 20220
          mkdir -p q50-factory
          base64 -d /tmp/q50-source.b64 | tar -xz -C q50-factory
          find q50-factory -maxdepth 3 -type f -print

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install EPK dependency
        run: python -m pip install cryptography

      - name: Build factory APK and EPK packages
        working-directory: q50-factory
        run: bash build.sh

      - name: Verify APK signatures and manifests
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          for apk in q50-factory/out/*.apk; do
            echo "== $apk =="
            "$BT/apksigner" verify --verbose --min-sdk-version 10 "$apk"
            "$BT/aapt" dump badging "$apk" | grep -E 'package:|sdkVersion|targetSdkVersion|launchable-activity'
          done

      - name: Verify EPK envelopes
        run: |
          python - <<'PY'
          import glob, struct, os
          for p in glob.glob('q50-factory/out/*.epk'):
              b=open(p,'rb').read()
              assert b[:4] == b'.epk', p
              ver, typ, blocks, keysize=struct.unpack('>HHHH', b[4:12])
              assert ver == 2 and typ == 2 and keysize > 0
              print(os.path.basename(p), 'version=',ver,'type=',typ,'blocks=',blocks,'keysize=',keysize,'bytes=',len(b))
          PY

      - name: Upload factory release
        uses: actions/upload-artifact@v4
        with:
          name: q50-factory-intouch
          path: q50-factory/out/*
          if-no-files-found: error
