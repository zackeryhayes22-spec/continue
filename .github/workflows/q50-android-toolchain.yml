name: Q50 Android Toolchain Export
on:
  push:
    branches:
      - build/q50-factory-intouch-20261013
    paths:
      - .github/workflows/q50-android-toolchain.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK pieces
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'
          mkdir -p /tmp/q50-android-toolchain/build-tools /tmp/q50-android-toolchain/platforms/android-34
          cp -a "$ANDROID_HOME/build-tools/34.0.0" /tmp/q50-android-toolchain/build-tools/
          cp "$ANDROID_HOME/platforms/android-34/android.jar" /tmp/q50-android-toolchain/platforms/android-34/
      - name: Upload Android toolchain
        uses: actions/upload-artifact@v4
        with:
          name: q50-android-toolchain-34.0.0
          path: /tmp/q50-android-toolchain
          if-no-files-found: error
